<title>公車亭元素描述快填</title>
<style>
:root{--bg:#f4f1ea;--ink:#2b2b2b;--panel:#fffdf8;--line:#e3ddcf;--muted:#8a8275;}
*{box-sizing:border-box;}body{margin:0;font-family:"Noto Sans TC","PingFang TC",sans-serif;color:var(--ink);background:var(--bg);}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
header h1{font-size:16px;margin:0;}.bar{flex:1;min-width:120px;height:10px;background:#e7e1d3;border-radius:6px;overflow:hidden;}.bar>i{display:block;height:100%;width:0;background:#5b8c5a;}
.count{font-size:13px;color:var(--muted);white-space:nowrap;}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
button,select,label.btn{font-family:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;cursor:pointer;}button:hover{background:#f0ece1;}
#key{font-size:12px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:180px;}
main{max-width:880px;margin:16px auto;padding:0 16px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.sv{width:100%;height:340px;background:#ddd;}.sv iframe,.sv img{width:100%;height:100%;border:0;object-fit:cover;display:block;}
.meta{padding:14px 18px 18px;}
.name{font-size:22px;font-weight:700;}.dist{font-size:12px;color:#fff;background:#7a8a99;border-radius:10px;padding:1px 9px;margin-left:8px;}
.catchip{display:inline-block;color:#fff;font-size:12px;padding:1px 10px;border-radius:11px;margin-left:6px;}
.openlink{font-size:13px;margin:6px 0;display:inline-block;}
.grp{margin-top:12px;}.grp .gt{font-size:12px;color:var(--muted);margin-bottom:5px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer;user-select:none;}
.chip.on{background:#3a342a;color:#fff;border-color:#3a342a;}
.preview{margin-top:14px;background:linear-gradient(135deg,#fbf8f1,#efe9db);border:1px solid var(--line);border-left:5px solid #b9a98a;border-radius:12px;padding:12px 14px;}
.preview .pl{font-size:11px;color:#7a6f59;letter-spacing:1px;margin-bottom:4px;}
.preview textarea{width:100%;border:none;background:transparent;font-family:inherit;font-size:15px;line-height:1.7;color:#3a352c;resize:vertical;min-height:46px;outline:none;}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;}
.nav .next{background:#5b8c5a;color:#fff;border-color:#5b8c5a;font-weight:600;padding:9px 22px;}
.cur{font-size:13px;color:var(--muted);}
.hint{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6;}
</style></head><body>
<header><h1>元素描述快填</h1>
<div class="bar"><i id="prog"></i></div><span class="count" id="count">0 / 0</span>
<div class="tools">
<select id="filter">
<option value="need">僅看:非基礎型未填</option>
<option value="nonbasic">全部非基礎型</option>
<option value="all">全部站點(完整辨識 494)</option>
</select>
<button id="fillbasic">基礎型一鍵套預設</button>
<input id="key" placeholder="(選填)街景 API 金鑰"/>
<button id="export">匯出 stations.json</button>
</div></header>
<main><div class="card" id="card">
<div class="sv" id="sv"></div>
<div class="meta">
<div><span class="name" id="sname">—</span><span class="dist" id="sdist"></span><span id="scats"></span></div>
<a class="openlink" id="svlink" target="_blank" rel="noopener">↗ 開啟 Google 街景</a>
<div class="grp"><div class="gt">站點圖片(角度可修正)</div>
<div style="display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap">街景角度 <input type="range" id="heading" min="0" max="350" step="10" value="0" style="flex:1;min-width:160px"><span id="hval">0°</span>
<button id="capimg" class="btn">用此角度更新此站圖片</button></div>
<input id="imgurl" placeholder="或貼上自訂圖片網址(會覆蓋街景圖)" style="width:100%;margin-top:6px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px;font-family:inherit;"></div>

<div class="nav"><button id="prev">← 上一個</button><span class="cur" id="cur"></span><button class="next" id="next">儲存 · 下一個 →</button></div>
</div></div>
<p class="hint" id="hint"></p></main>

const LS="buselem_v1",KEYLS="busclassify_key";
let stations=[],idx=0,filter="need",apiKey="";
function cleanCats(s){return Array.isArray(s.cats)?s.cats:[];}
function isBasic(s){const c=cleanCats(s);return c.length>0&&c.every(x=>x==="basic");}
function load(){let sv=null;try{sv=JSON.parse(localStorage.getItem(LS));}catch(e){}
  stations=(sv&&sv.length)?sv:SEED.stations.map(s=>({...s}));
  apiKey=localStorage.getItem(KEYLS)||keyFromData()||"";document.getElementById("key").value=apiKey;}
function keyFromData(){for(const s of (SEED.stations||[])){const m=(s.img||"").match(/key=([^&]+)/);if(m)return m[1];}return "";}
function parseHeading(img){const m=(img||"").match(/heading=(\d+)/);return m?+m[1]:0;}
function save(){localStorage.setItem(LS,JSON.stringify(stations));}
function view(){const f=filter;return stations.filter(s=>{
  if(f==="all")return true;
  const nb=cleanCats(s).some(c=>c!=="basic");
  if(f==="nonbasic")return nb;
  return nb&&!(s.elements||"").trim();});}
function svStatic(s,h){return "https://maps.googleapis.com/maps/api/streetview?size=640x340&location="+s.lat+","+s.lng+"&fov=80&heading="+h+"&pitch=0&key="+apiKey;}
function tagsOf(s){return (s.elements||"").split(/[、,]/).map(t=>t.trim()).filter(Boolean);}
function render(){const v=view();const base=(filter==="all")?stations:stations.filter(s=>cleanCats(s).some(c=>c!=="basic"));
  const filled=base.filter(s=>(s.elements||"").trim()).length;
  document.getElementById("count").textContent="已填 "+filled+" / "+base.length;
  document.getElementById("prog").style.width=(base.length?filled/base.length*100:0)+"%";
  if(!v.length){document.getElementById("card").innerHTML='<div style="padding:50px;text-align:center">這個篩選沒有站點 🎉 全部填完了可按「匯出 stations.json」。</div>';return;}
  if(idx>=v.length)idx=v.length-1;if(idx<0)idx=0;const s=v[idx];
  document.getElementById("sname").textContent=s.name;document.getElementById("sdist").textContent=s.district||"";
  document.getElementById("scats").innerHTML=cleanCats(s).map(c=>`<span class="catchip" style="background:${CATCOLOR[c]}">${CATNAME[c]}</span>`).join("");
  const curC=new Set(cleanCats(s));
  document.getElementById("catedit").innerHTML=["nature","landmark","sustainable","art","basic"].map(c=>`<span class="chip${curC.has(c)?' on':''}" data-cat="${c}" style="${curC.has(c)?('background:'+CATCOLOR[c]+';border-color:'+CATCOLOR[c]):''}">${CATNAME[c]}</span>`).join("");
  [...document.querySelectorAll("#catedit .chip")].forEach(el=>el.onclick=()=>toggleCat(el.dataset.cat));
  document.getElementById("cur").textContent=(idx+1)+" / "+v.length;
  document.getElementById("text").value=s.elements||"";
  // street view
  const hd=parseHeading(s.img);document.getElementById("heading").value=hd;document.getElementById("hval").textContent=hd+"°";
  const isCustom=(s.img||"")&&!/streetview/.test(s.img);document.getElementById("imgurl").value=isCustom?s.img:"";
  drawSV(s,hd);
  document.getElementById("svlink").href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint="+s.lat+","+s.lng;
  // chip groups
  const sel=new Set(tagsOf(s));
  let groups=[["通用",GENERAL],["與周邊關係",RELATION]];
  cleanCats(s).forEach(c=>{if(BYCAT[c])groups.push([CATNAME[c],BYCAT[c]]);});
  document.getElementById("groups").innerHTML=groups.map(([t,arr])=>`<div class="grp"><div class="gt">${t}</div><div class="chips">${arr.map(tag=>`<span class="chip${sel.has(tag)?' on':''}" data-tag="${tag}">${tag}</span>`).join("")}</div></div>`).join("");
  [...document.querySelectorAll("#groups .chip")].forEach(el=>el.onclick=()=>toggleTag(el.dataset.tag));
}
function curStation(){return view()[idx];}
function toggleCat(cat){const s=curStation();if(!s)return;let cs=cleanCats(s).slice();
  if(cat==="basic"){cs=cs.includes("basic")?[]:["basic"];}
  else{cs=cs.filter(c=>c!=="basic");cs=cs.includes(cat)?cs.filter(c=>c!==cat):cs.concat(cat);}
  s.cats=cs;save();render();}
function toggleTag(tag){const s=curStation();if(!s)return;let tags=tagsOf(s);
  if(tags.includes(tag))tags=tags.filter(t=>t!==tag);else tags.push(tag);
  s.elements=tags.join("、");save();render();}
document.getElementById("text").addEventListener("input",e=>{const s=curStation();if(s){s.elements=e.target.value;}});
document.getElementById("text").addEventListener("blur",()=>{save();render();});
function advance(){const v=view();if(filter==="need"){if(v.length){idx=Math.min(idx, v.length-1);}render();return;}
  idx=Math.min(idx+1,v.length-1);render();}
document.getElementById("next").onclick=()=>{const s=curStation();if(s){s.elements=document.getElementById("text").value;save();}
  if(filter==="need"){render();}else{idx=Math.min(idx+1,view().length-1);render();}};
document.getElementById("prev").onclick=()=>{idx=Math.max(0,idx-1);render();};
document.getElementById("filter").onchange=e=>{filter=e.target.value;idx=0;render();};
document.getElementById("key").onchange=e=>{apiKey=e.target.value.trim();localStorage.setItem(KEYLS,apiKey);render();};
document.getElementById("fillbasic").onclick=()=>{let n=0;stations.forEach(s=>{if(isBasic(s)&&!(s.elements||"").trim()){s.elements=BASIC_DEFAULT;n++;}});save();render();alert("已為 "+n+" 個基礎型站套用預設描述。");};
document.getElementById("export").onclick=()=>{const out=JSON.stringify({stations:stations.map(s=>({id:s.id,name:s.name,district:s.district,lat:s.lat,lng:s.lng,cats:cleanCats(s),elements:s.elements||"",img:s.img||""}))},null,1);
  const b=new Blob([out],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="stations.json";a.click();};
document.getElementById("hint").innerHTML="流程:先按<b>「基礎型一鍵套預設」</b>(324 個基礎型免打)→ 再用「僅看非基礎型未填」逐站<b>點標籤</b>組成描述,需要時補打字 → 按「儲存·下一個」。"+
 "全部填完按「匯出 stations.json」給 Claude 烤進網站。進度自動存本機,可隨時關閉再回來。";
function drawSV(s,hd){const sv=document.getElementById("sv");const cust=(s.img||"")&&!/streetview/.test(s.img);
  if(cust){sv.innerHTML='<img src="'+s.img+'">';}
  else if(apiKey){sv.innerHTML='<img src="'+svStatic(s,hd)+'">';}
  else{sv.innerHTML='<iframe loading="lazy" allowfullscreen src="https://www.google.com/maps?q=&layer=c&cbll='+s.lat+','+s.lng+'&cbp=11,'+hd+',0,0,0&output=svembed"></iframe>';}}
document.getElementById("heading").oninput=e=>{document.getElementById("hval").textContent=e.target.value+"°";const s=curStation();if(s)drawSV(s,+e.target.value);};
document.getElementById("capimg").onclick=()=>{const s=curStation();if(!s)return;if(!apiKey){alert("沒有街景金鑰,請改用下方貼自訂圖片網址。");return;}s.img=svStatic(s,+document.getElementById("heading").value);save();alert("已更新此站圖片角度。");};
document.getElementById("imgurl").onchange=e=>{const s=curStation();if(!s)return;const u=e.target.value.trim();if(u){s.img=u;save();drawSV(s,0);}};
load();render();
</script></body></html>
