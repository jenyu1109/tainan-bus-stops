header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}

.count{font-size:13px;color:var(--muted);white-space:nowrap;}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

#key{font-family:inherit;font-size:12px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:190px;}
main{max-width:860px;margin:16px auto;padding:0 16px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.sv{position:relative;width:100%;height:420px;background:#ddd;}.sv iframe,.sv img{width:100%;height:100%;border:0;object-fit:cover;display:block;}
.svhint{position:absolute;left:0;right:0;bottom:0;background:#0008;color:#fff;font-size:12px;padding:6px 10px;}
.headrow{display:flex;align-items:center;gap:10px;padding:8px 16px 0;font-size:12px;color:var(--muted);}.headrow input[type=range]{flex:1;}
.meta{padding:12px 18px 16px;}
.name{font-size:22px;font-weight:700;}.dist{display:inline-block;font-size:12px;color:#fff;background:#7a8a99;border-radius:10px;padding:1px 9px;margin-left:8px;vertical-align:middle;}
.openlink{font-size:13px;margin-top:6px;display:inline-block;}
.tip{font-size:12px;color:var(--muted);margin-top:12px;}
.cats{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
.cat{flex:1;min-width:118px;border:2px solid;border-radius:10px;padding:12px 10px;text-align:center;font-weight:600;font-size:15px;color:#fff;cursor:pointer;transition:transform .08s;opacity:.45;}
.cat:active{transform:scale(.97);}.cat small{display:block;font-weight:400;font-size:11px;opacity:.95;margin-top:3px;}
.cat.on{opacity:1;outline:4px solid #2b2b2b33;}
.note{margin-top:12px;}.note input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:13px;}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;}
.nav .next{background:#5b8c5a;color:#fff;border-color:#5b8c5a;font-weight:600;padding:9px 22px;}
.cur{font-size:13px;color:var(--muted);}
.hint{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6;}.done{text-align:center;padding:50px 20px;}

const LS="busclassify_v3",KEYLS="busclassify_key";
let stations=[],idx=0,filter="all",apiKey="";
function svStatic(s,h){return "https://maps.googleapis.com/maps/api/streetview?size=640x420&location="+s.lat+","+s.lng+"&fov=80&heading="+h+"&pitch=0&key="+apiKey;}
function norm(s){return {...s,cats:Array.isArray(s.cats)?s.cats:(s.category?[s.category]:[])};}
function load(){let saved=null;try{saved=JSON.parse(localStorage.getItem(LS));}catch(e){}
  stations=(saved&&saved.length)?saved.map(norm):SEED.stations.map(norm);
  apiKey=localStorage.getItem(KEYLS)||"";document.getElementById("key").value=apiKey;}
function save(){localStorage.setItem(LS,JSON.stringify(stations));}
function view(){return filter==="all"?stations:stations.filter(s=>s.district===filter);}
function buildCats(){const c=document.getElementById("cats");c.innerHTML="";
  CATS.forEach(cat=>{const d=document.createElement("div");d.className="cat";d.style.background=cat.color;d.style.borderColor=cat.color;d.dataset.id=cat.id;
    d.innerHTML=cat.name+"<small>"+cat.desc+"</small>";d.onclick=()=>choose(cat.id);c.appendChild(d);});}
function render(){const v=view();const total=stations.length,done=stations.filter(s=>s.cats.length).length;
  document.getElementById("count").textContent=done+" / "+total;document.getElementById("prog").style.width=(total?done/total*100:0)+"%";
  if(!v.length){document.getElementById("card").innerHTML='<div class="done">此篩選沒有站點。</div>';return;}
  if(idx>=v.length)idx=v.length-1;if(idx<0)idx=0;const s=v[idx];
  document.getElementById("sname").textContent=s.name;document.getElementById("sdist").textContent=s.district||"";
  document.getElementById("cur").textContent=(idx+1)+" / "+v.length+(s.cats.length?(" · "+s.cats.map(id=>(CATS.find(c=>c.id===id)||{}).name).join("、")):"");
  document.getElementById("elem").value=s.elements||"";
  const sv=document.getElementById("sv");const h=+document.getElementById("heading").value;
  if(apiKey){document.getElementById("headrow").style.display="flex";document.getElementById("imgrow").style.display="none";
    sv.innerHTML='<img src="'+svStatic(s,h)+'"><div class="svhint">此靜態街景圖會在你分類時存進網站</div>';}
  else{document.getElementById("headrow").style.display="none";document.getElementById("imgrow").style.display="block";
    document.getElementById("imgurl").value=s.img||"";
    sv.innerHTML='<iframe loading="lazy" allowfullscreen src="https://www.google.com/maps?q=&layer=c&cbll='+s.lat+','+s.lng+'&cbp=11,'+h+',0,0,0&output=svembed"></iframe>';}
  document.getElementById("svlink").href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint="+s.lat+","+s.lng;
  [...document.querySelectorAll(".cat")].forEach(el=>el.classList.toggle("on",s.cats.includes(el.dataset.id)));}
function captureImg(s){const h=+document.getElementById("heading").value;
  if(apiKey){s.img=svStatic(s,h);}else{const u=document.getElementById("imgurl").value.trim();if(u)s.img=u;}}
function advance(){const v=view();let n=-1;for(let k=idx+1;k<v.length;k++){if(!v[k].cats.length){n=k;break;}}
  if(n===-1){for(let k=0;k<v.length;k++){if(!v[k].cats.length){n=k;break;}}}
  idx=n===-1?Math.min(idx+1,v.length-1):n;render();}
function choose(catId){const v=view();const s=v[idx];if(!s)return;s.elements=document.getElementById("elem").value.trim();
  if(catId==="basic"){s.cats=["basic"];captureImg(s);save();advance();return;}
  // toggle design type, drop basic
  s.cats=s.cats.filter(c=>c!=="basic");
  if(s.cats.includes(catId))s.cats=s.cats.filter(c=>c!==catId);else s.cats.push(catId);
  captureImg(s);save();render();}
document.getElementById("prev").onclick=()=>{idx=Math.max(0,idx-1);render();};
document.getElementById("next").onclick=()=>{const s=view()[idx];if(s){s.elements=document.getElementById("elem").value.trim();captureImg(s);save();}advance();};
document.getElementById("filter").onchange=e=>{filter=e.target.value;idx=0;render();};
document.getElementById("heading").oninput=e=>{document.getElementById("hval").textContent=e.target.value+"°";render();};
document.getElementById("key").onchange=e=>{apiKey=e.target.value.trim();localStorage.setItem(KEYLS,apiKey);render();};
document.getElementById("reset").onclick=()=>{if(confirm("清除所有已存的分類進度?")){localStorage.removeItem(LS);idx=0;load();render();}};
document.getElementById("export").onclick=()=>{const out=JSON.stringify({stations:stations.map(s=>({id:s.id,name:s.name,district:s.district,lat:s.lat,lng:s.lng,cats:s.cats,elements:s.elements||"",img:s.img||""}))},null,1);
  const b=new Blob([out],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="stations.json";a.click();};
document.getElementById("loadFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{let arr;if(f.name.endsWith(".csv")){arr=parseCSV(r.result);}else{const d=JSON.parse(r.result);arr=d.stations||d;}
    stations=arr.map((s,i)=>norm({id:s.id||("s"+(i+1)),name:s.name,district:s.district||"",lat:+s.lat,lng:+s.lng,cats:s.cats,category:s.category,elements:s.elements||"",img:s.img||""}));
    idx=0;save();render();alert("已載入 "+stations.length+" 個站點。");}catch(err){alert("檔案讀取失敗:"+err.message);}};r.readAsText(f,"utf-8");};
function parseCSV(txt){const lines=txt.replace(/\x00/g,"").split(/\r?\n/).filter(l=>l.trim());
  const head=lines[0].split(",").map(h=>h.trim().toLowerCase());const gi=n=>head.findIndex(h=>h.includes(n));
  const ni=gi("name")>=0?gi("name"):gi("站名"),di=gi("dist")>=0?gi("dist"):gi("區"),la=gi("lat")>=0?gi("lat"):gi("緯"),lo=gi("lon")>=0?gi("lon"):gi("經");
  return lines.slice(1).map(l=>{const c=l.split(",");return{name:c[ni],district:di>=0?c[di]:"",lat:c[la],lng:c[lo]};});}
document.getElementById("hint").innerHTML="基礎型=點一下直接跳下一站(最常用)。有設計特色的站可複選多個分類,再按「下一個」。"+
 "<b>要讓站點圖片出現在主網站</b>:填 Google 街景 Static API 金鑰,分類時自動存街景圖;沒金鑰可手動貼圖片網址。"+
 "進度自動存本機。全部分完按「匯出 stations.json」,用主網站「載入 stations.json」即可套用。";
buildCats();load();render();
</script></body></html>
